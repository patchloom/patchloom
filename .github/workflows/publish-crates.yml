name: Publish crates.io package

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

concurrency:
  group: publish-crates-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Validate dist plan input
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os

          plan = json.loads(os.environ["PLAN"])
          if not plan.get("releases"):
              raise SystemExit("dist plan contained no releases")
          PY

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Verify package metadata
        run: cargo package --locked --package patchloom || cargo package --package patchloom

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --package patchloom
