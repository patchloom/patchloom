# Pack the local stdio MCPB and publish to Smithery after a GitHub Release.
# Soft-skips when SMITHERY_API_KEY is unset (same pattern as Chocolatey).
# Auth: create a key at smithery.ai (account API keys) or `smithery auth token`,
# then: gh secret set SMITHERY_API_KEY --repo patchloom/patchloom
name: Publish Smithery

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to pack/publish (e.g. 0.15.2). Empty uses latest GitHub Release tag."
        required: false
        type: string

concurrency:
  group: publish-smithery-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    if: ${{ !github.event.repository.private }}
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          if [ -z "$version" ] && [ -n "${RELEASE_TAG:-}" ]; then
            version="${RELEASE_TAG#patchloom-v}"
            version="${version#v}"
          fi
          if [ -z "$version" ]; then
            tag=$(gh release view --json tagName --jq .tagName)
            version="${tag#patchloom-v}"
            version="${version#v}"
          fi
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "Could not resolve a package version" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${version}"

      # No Node/npm install: pack-mcpb.sh builds a zip MCPB (official format)
      # with python3+zip only. Avoids Scorecard Pinned-Dependencies npmCommand
      # alerts (#49/#50). Optional local pack with official CLI:
      # PACK_MCPB_USE_CLI=1 npm install -g @anthropic-ai/mcpb@2.1.2

      - name: Pack MCPB
        env:
          # pack-mcpb.sh prefers VERSION over Cargo.toml so workflow_dispatch
          # of an older tag does not need to rewrite Cargo.toml on disk.
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/pack-mcpb.sh

      - name: Upload MCPB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: patchloom-mcpb
          path: target/mcpb/patchloom-*.mcpb
          if-no-files-found: error

      - name: Publish to Smithery
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${SMITHERY_API_KEY:-}" ]; then
            echo "SMITHERY_API_KEY unset; packing succeeded, publish soft-skipped."
            echo "Set the secret via: smithery auth login && smithery auth whoami --full | gh secret set SMITHERY_API_KEY"
            exit 0
          fi
          # Do not curl|python the npm registry here: Scorecard Pinned-
          # Dependencies flags unpinned downloadThenRun (#51). Publish can
          # proceed; npx clients may retry if npm lag. No network download
          # in this step.
          # Use REST API (scripts/publish-smithery.sh). CLI 1.2.0 can 400 with
          # "No values to set" for stdio MCPB even when the API succeeds.
          bash scripts/publish-smithery.sh
